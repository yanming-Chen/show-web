<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta property="og:title" content="6/13聖管部春酒-抽箴言" />
<meta property="og:description" content="抽箴言" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://github.com/yanming-Chen/show-web/blob/main/image.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天抽一句</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
  min-height: 100vh;
  background: linear-gradient(180deg, #ffe4e6 0%, #ffffff 45%, #ffedd5 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  color: #1f2937;
}
.phone {
  width: 100%;
  max-width: 420px;
  background: #fff;
  border-radius: 32px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.7);
  box-shadow: 0 20px 50px rgba(0,0,0,.15);
}
.top {
  background: linear-gradient(90deg, #fb7185, #fdba74);
  color: #fff;
  padding: 24px 20px 18px;
}
.title {
  font-size: 30px;
  font-weight: 800;
}
.content {
  padding: 20px;
}
.card {
  min-height: 360px;
  max-height: 62vh;
  overflow-y: auto;
  border-radius: 28px;
  background: linear-gradient(135deg, #fff1f2, #fff7ed);
  border: 1px solid #ffe4e6;
  padding: 20px;
  box-shadow: 0 4px 12px rgba(0,0,0,.04);
}
.emoji {
  font-size: 36px;
  line-height: 1;
}
.quote {
  margin-top: 14px;
  font-size: 21px;
  line-height: 1.85;
  white-space: pre-wrap;
  word-break: break-word;
}
button {
  width: 100%;
  border: 0;
  border-radius: 20px;
  padding: 16px;
  margin-top: 16px;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  background: #111827;
  color: white;
  box-shadow: 0 12px 24px rgba(17,24,39,.18);
}
.homebar {
  padding: 0 24px 16px;
}
.homebar div {
  height: 6px;
  width: 112px;
  background: #e5e7eb;
  border-radius: 999px;
  margin: 0 auto;
}
@media (max-width: 480px) {
  .title { font-size: 28px; }
  .quote { font-size: 20px; }
  .card { min-height: 340px; }
}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <div class="title">今天抽一句</div>
  </div>

  <div class="content">
    <div class="card">
      <div class="emoji">✨</div>
      <div id="quote" class="quote">點一下按鈕，抽出今天的一句話</div>
    </div>

    <button onclick="draw()">抽一句</button>
  </div>

  <div class="homebar"><div></div></div>
</div>

<script>
const quotes = [
  "我們做任何事情時，因為是自己肉眼看到的，所以會陷入自我主觀和自我想法去做。去做時不要以自我主觀和自我想法為中心去做。",
  "＜人＞也是一樣，比起自己獨自生活，當互相產生「人際關係」而一起生活時，會覺得更理想、美麗、神祕及喜悅。",
  "有時針對某件事，「自己」雖然盡到了責任，但如果「對方」沒有盡到責任，就可能不會達成。因此，＜共同的責任＞要彼此互助且同心合力去盡到。",
  "＜言語＞的關鍵是「讓人聽懂」。即使是天使，若說得讓人無法聽懂，那句話依然毫無價值。",
  "＜一千句話＞不如＜一句令人感動的話＞。那一句話會左右命運。",
  "在＜很會說話＞這方面多多練習吧！這樣，當人聽到你所說的話時，才會得到感動而去做。",
  "讓＜攝理史全體的想法＞團結合一吧！要在這樣的狀態下按照「各自的特質」來行動。大家都要一致地領受＜主的話語＞，並以＜那話語＞團結合一。",
  "在攝理史中不要互相比較。有人「擅長傳道」，有人「擅長管理」，有人「擅長講義」，有人「擅長經濟」，有人「擅長把人們凝聚在一起」。各人的特質都不同，所以彼此談論做得好的部分來分享恩典吧！",
  "若「所說的話」和三位相合，「想法」也相合，就會和三位連結起來。",
  "＜言語＞也是越「細膩地表達」，聆聽的人越會被刺激而立刻感受到，會有所體會、得到感動而喜悅、開心並認定",
  "即使辛苦也還是要＜對話＞，若連＜對話＞都不做，就會變成獨自一人。",
  "在對待人或萬物時也要懂得溝通，才能度過有趣、有成就感又有價值的生活，甚至在危險時還能幫助你避開或把你救出來。",
  "不論是什麼＜材料＞，若很會「料理」都會成為山珍海味；同樣地，若好好地「構想並表達」就會成為傑作。",
  "＜言語的表達＞若想做得好，就要「清楚地瞭解」。要「明確地說出來、說到讓對方理解」。",
  "無論什麼事都要好好表達，才會帥氣又美麗地達成；同樣地，＜生活＞也要以「生活的行為」好好表達，才會美麗、神祕又雄壯地達成。",
  "不論是在蓋房子或製作作品的時候，每個當下都要使用適合的工具或材料才能順利完成。就像這樣，在信仰內也是一樣，不論大或小都要團結合一來做，事情才能順利完成。",
  "＜攝理史＞是「同一副身軀」。＜各為不同肢體，各有不同使命＞。因此瞭解各個肢體、各個使命後再對待吧！若不瞭解這點，就會互相阻擋、碰撞。",
  "憑＜自己＞很難做得完全。＜主體＞和＜對象＞都要做得完全，互相幫助、互相扶持、互相支持、互相拉拔，如此合一去做，這樣做起事來才會有趣、喜悅並樂在其中。",
  "自己要思考，做事的人也要思考並擬定計畫，讓大家能一起加入。　神說：「擬定計畫時要讓聖靈一起做，也要讓安排的人一起做，這樣才會帥氣地興起融合作用。」",
  "如同尊敬　神和聖靈，並以愛來對待祂們那般，＜和睦地對待弟兄和晚輩＞是「非常偉大的信仰生活」。實踐這點的人會領受「和睦的福分」，也會如同季節更迭般不間斷地領受「屬乎　神的自己的福分」。",
  "大功績無法獨自一人立下，需要彼此團結、一起行動。",
  "不論是個人、家庭、民族或是世界，都要齊心合力、共同合作才會興盛，連不可能的事情也能做到而變得亨通、獲得成功。",
  "大家都要共同合作，團結合一，才會和平、和睦並達成　神所祝福的歷史。",
  "要互相幫助、一起去做，才能得到更加理想的事物。",
  "做事時、待人時、傳道時或管理時都要和睦且喜悅地做，才能不耗費許多力氣就輕鬆達成目標。",
  "單憑一人無法做大事。這就好比發現一顆大石頭後，不管那顆石頭有多好，也無法獨自把它帶回來。就連指導者也帶不回來，頭腦很好的人也帶不回來，力氣很大的大力士也很難獨自帶回來。必須好幾個人齊心合力、團結合一搬運才帶得回來。",
  "盡可能地和睦相處吧！他們是 神、聖靈和主所愛的人，與弟兄和睦相處就是與三位和主和睦相處。",
  "若在弟兄承受痛苦時說出對他有所助益的話，他就會直接按照那句話的內容得到幫助，不用經由任何人。就像這樣，若幫忙禱告，那生命就會立刻得到幫助，而且 神聽到那禱告後也會立刻給予幫助，或吩咐使者給予幫助。所以，為生命禱告吧！",
  "藉由　神的愛，能彼此扶持、彼此安慰、彼此幫助而獲得信仰的勝利。",
  "人們若以愛與和平為彼此著想，以真實和公義順從並遵行　神的話語，以和睦讚美　神並且彼此融洽地相處，三位也會有所回應，讓人更洋溢著喜悅。",
  "有些人負責傳道、有些人負責教導、有些人負責管理和栽培。能力很強的人可以獨自做到所有的事，但是大部分的人獨自去做會很吃力，因此要分工合作。",
  "若攝理史彼此相通，全體合一，就能發揮驚人的力量，即使發生事情也能立刻處理。",
  "人與人的關係取決於如何相處，同樣地，與 神、聖靈、聖子、耶穌的關係也取決於如何相處。",
  "觀察對方的心理、內心和臉色來說話吧！"
];

function draw() {
  const picked = quotes[Math.floor(Math.random() * quotes.length)];
  document.getElementById("quote").innerText = picked;
}
</script>
</body>
</html>
